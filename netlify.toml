# Netlify configuration for ComplianceCheck
# Next.js 14 App Router deployment

[build]
  command = "npm run build"
  publish = ".next"

# Use the Next.js runtime plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables (set these in Netlify dashboard for production)
# NEXT_PUBLIC_SUPABASE_URL
# NEXT_PUBLIC_SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# RAZORPAY_KEY_ID
# RAZORPAY_KEY_SECRET

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirects (optional - for custom domain)
# [[redirects]]
#   from = "https://compliancecheck.netlify.app/*"
#   to = "https://compliancecheck.in/:splat"
#   status = 301
#   force = true
