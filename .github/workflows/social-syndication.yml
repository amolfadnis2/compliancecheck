name: Social syndication

# When a new/updated article lands on the default branch, regenerate the
# per-platform social drafts and (optionally) ping a scheduler webhook.
# The webhook step is inert until a SOCIAL_WEBHOOK_URL repo secret is set —
# so no tokens are ever committed and the pipeline is safe by default.

on:
  push:
    branches: [master]
    paths:
      - 'content/blog/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate social drafts
        run: node scripts/generate-social.mjs

      - name: Commit drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/social
          if git diff --cached --quiet; then
            echo "No draft changes."
          else
            git commit -m "Regenerate social drafts"
            git push
          fi

      - name: Notify scheduler (optional)
        if: ${{ secrets.SOCIAL_WEBHOOK_URL != '' }}
        env:
          SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
        run: |
          curl -fsS -X POST "$SOCIAL_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"event":"blog_published","feed":"https://compliancecheck.co.in/feed.xml"}' \
            || echo "Webhook call failed (non-fatal)."
